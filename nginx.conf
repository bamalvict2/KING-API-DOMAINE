user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;

    server {
        listen 80;
        server_name _;

        # API
        location /api/ {
            proxy_pass http://solaize-api:8080/;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana:3000/;
        }

        # Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
        }

        # Page simple par défaut (optionnel)
        location / {
            return 200 "SDK Solaize – HTTP only, Grafana & Prometheus disponibles.\n";
            add_header Content-Type text/plain;
        }
    }
}