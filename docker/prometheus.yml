global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'eparvier-api'
    static_configs:
      - targets: ['eparvier-api:80']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://eparvier-api:80
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
